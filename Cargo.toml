[package]
name = "dupkey"
version = "0.1.0"
edition = "2021"
description = "Identifie les doublons exacts de fichiers (clé = taille + BLAKE3)"

[dependencies]
anyhow = "1"
blake3 = { version = "1", features = ["rayon"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4", features = ["derive"] }
dunce = "1"
globset = "0.4"
jwalk = "0.8"
md-5 = "0.10"
memmap2 = "0.9"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
